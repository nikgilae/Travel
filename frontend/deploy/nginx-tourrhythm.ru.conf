# nginx server-блок для tourrhythm.ru (статика SPA).
#
# СЮДА положить: /etc/nginx/sites-available/tourrhythm.ru
# Стиль и порядок директив намеренно повторяют существующий
# /etc/nginx/sites-available/api.tourrhythm.ru, чтобы certbot мог
# так же автоматически дописать 443-блок и редирект с 80 на 443
# (как он уже сделал для api-поддомена).
#
# ВАЖНО: на этом шаге сертификата ещё нет — только порт 80.
# 443-блок и HTTPS-редирект допишет сам certbot на шаге 30-certbot.sh.
# Не пытайся вручную добавлять "listen 443" до этого — certbot
# ожидает найти чистый http-блок, чтобы понять, куда врезать SSL.

server {
    listen 80;
    listen [::]:80;
    server_name tourrhythm.ru www.tourrhythm.ru;

    root /var/www/tourrhythm.ru/current;
    index index.html;

    # Сжатие: у нас 546 КБ JS, gzip обычно даёт ~70% экономии на JS/CSS.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Хэшированные ассеты (index-oy-EdvbF.js) — имя меняется при каждой
    # пересборке, поэтому кэшировать их можно "навсегда": если файл
    # изменился, у него будет другое имя, а не то же самое с новым
    # содержимым.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html МЕНЯЕТСЯ при каждом деплое без смены имени — его
    # никогда нельзя кэшировать надолго, иначе часть пользователей
    # получит старый index.html, ссылающийся на уже удалённые
    # хэшированные ассеты предыдущего релиза (после чистки старых
    # releases/ в деплой-скрипте это будет 404 на JS).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA-роутинг: любой путь, не совпавший с реальным файлом,
    # отдаём как index.html — эквивалент rewrite-правила из
    # прежнего frontend/vercel.json ("/(.*)" -> "/").
    location / {
        try_files $uri $uri/ /index.html;
    }
}
